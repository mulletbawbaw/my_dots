# ── MulletBawbaw // kitty ────────────────────────────────────────────
# Cores: mulletbawbaw.conf (gerado por ~/my_dots/theme/generate.py)
include mulletbawbaw.conf

# Fonte (mesmo tamanho de antes da migração)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0
disable_ligatures cursor

# Transparência só no fundo: o texto continua 100% opaco.
# O blur vem do Hyprland; no KDE/X11 o KWin decide.
background_opacity 0.94
dynamic_background_opacity yes

# Cursor: bloco verde com rastro roxo curto (rastro some rápido para não distrair)
cursor_shape block
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.08 0.25
cursor_trail_start_threshold 3

# Espaçamento interno
window_padding_width 6 10
placement_strategy top-left

# Tabs estilo "slot" de HUD
tab_bar_edge top
tab_bar_style separator
tab_separator ""
tab_title_template " {fmt.bold}{index}{fmt.nobold} {title[:28]} "
active_tab_title_template " {fmt.bold}▶ {index}{fmt.nobold} {title[:28]} "
tab_bar_min_tabs 2

# Latência: renderiza assim que houver input, sem esperar o próximo frame ocioso
input_delay 2
repaint_delay 6
sync_to_monitor yes

# Integração com shell (marcações de prompt, cd em novas janelas, etc.)
shell_integration enabled

# Sem bipe sonoro NEM visual: o flash roxo no Tab (bell do zsh) incomodava.
# O zsh também tem `nobeep` (mulletbawbaw/core.zsh); aqui é a segunda camada.
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell no
bell_on_tab ""

confirm_os_window_close 0
