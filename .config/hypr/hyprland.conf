# Always refer to Hyprland wiki
# https://wiki.hyprland.org/

# -----------------------------------------------------
# INITIAL BOOT
# -----------------------------------------------------

# Initial boot script enable to apply initial wallpapers, theming, new settings etc.
# Suggest not to change this or delete this including deleting reference file in:
# ~/.config/hypr/.initial_startup_done
# As long as the reference file is present, this initial-boot.sh will not execute
exec-once = $HOME/.config/hypr/initial-boot.sh

# -----------------------------------------------------
# WALLPAPER
# -----------------------------------------------------

# Wallpaper daemon + restore last selected wallpaper
exec-once = awww-daemon
exec-once = sleep 1 && ~/.config/hypr/scripts/WallpaperRestore.sh

# Open wallpaper selector with SUPER + W
bind = SUPER, W, exec, ~/.config/hypr/scripts/WallpaperPicker.sh

# -----------------------------------------------------
# SOURCING EXTERNAL CONFIG FILES
# -----------------------------------------------------

# Default Configs directory path
$configs = $HOME/.config/hypr/configs

# Pre-configured keybinds
source = $configs/Keybinds.conf

# User Configs directory path
$UserConfigs = $HOME/.config/hypr/UserConfigs

# Startup applications
source = $UserConfigs/Startup_Apps.conf

# Environment variables
source = $UserConfigs/ENVariables.conf

# Old dots monitor/workspace configs
# source = $UserConfigs/Monitors.conf
# source = $UserConfigs/WorkspaceRules.conf

# Laptop related configs
source = $UserConfigs/Laptops.conf
source = $UserConfigs/LaptopDisplay.conf

# Window and layer rules
source = $UserConfigs/WindowRules.conf

# Decorations
source = $UserConfigs/UserDecorations.conf

# Animations
source = $UserConfigs/UserAnimations.conf

# User keybinds
source = $UserConfigs/UserKeybinds.conf

# Main Hyprland settings
source = $UserConfigs/UserSettings.conf

# User default apps
source = $UserConfigs/01-UserDefaults.conf

# nwg-displays generated configs
source = $HOME/.config/hypr/monitors.conf
source = $HOME/.config/hypr/workspaces.conf

# -----------------------------------------------------
# EXTRA KEYBINDS
# -----------------------------------------------------

# Move focused window to another monitor
bind = SUPER SHIFT, left, movewindow, mon:left
bind = SUPER SHIFT, right, movewindow, mon:right
bind = SUPER SHIFT, up, movewindow, mon:up
bind = SUPER SHIFT, down, movewindow, mon:down

# Move focused window to next/previous workspace
bind = SUPER SHIFT, PAGE_DOWN, movetoworkspace, +1
bind = SUPER SHIFT, PAGE_UP, movetoworkspace, -1

# -----------------------------------------------------
# MULLETBAWBAW RICE (por último: sobrescreve visual, regras e binds duplicados)
# Rollback: comente a linha abaixo e rode `hyprctl reload`.
# -----------------------------------------------------
source = $HOME/.config/hypr/mulletbawbaw/rice.conf
