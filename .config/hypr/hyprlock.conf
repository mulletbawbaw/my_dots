# ── MulletBawbaw // hyprlock: "GAME PAUSED" ──────────────────────────
# Cores: mulletbawbaw/colors.conf (gerado). Versão gruvbox antiga:
#   git show main:.config/hypr/hyprlock.conf
# Se algo der errado com o lock: Ctrl+Alt+F3, login, `pkill hyprlock`.

source = $HOME/.config/hypr/mulletbawbaw/colors.conf
$walls = $HOME/.local/share/mulletbawbaw/wallpapers/undead-arcade

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

# Mesmo par de wallpapers do desktop, escurecido e com blur
background {
    monitor = DP-1
    path = $walls/main.png
    color = $mb_bg
    blur_size = 4
    blur_passes = 2
    brightness = 0.55
    contrast = 1.1
    vibrancy = 0.15
}
background {
    monitor =
    path = $walls/side.png
    color = $mb_bg
    blur_size = 4
    blur_passes = 2
    brightness = 0.45
}

# Cabeçalho
label {
    monitor = DP-1
    text = ⏸  GAME PAUSED
    color = $mb_purple
    font_size = 20
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -90
    halign = center
    valign = top
}

# Relógio grande
label {
    monitor = DP-1
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $mb_green_neon
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -140
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $mb_glow
}
label {
    monitor = DP-1
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = $mb_fg
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -330
    halign = center
    valign = top
}

# Personagem
image {
    monitor = DP-1
    path = $HOME/.local/share/mulletbawbaw/assets/zombie-fetch.png
    size = 230
    rounding = 0
    border_size = 0
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = PLAYER 1 · $USER
    color = $mb_zombie
    font_size = 14
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 190
    halign = center
    valign = bottom
}

input-field {
    monitor = DP-1
    size = 320, 54
    outline_thickness = 2
    rounding = 8
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    outer_color = $mb_purple_neon
    inner_color = $mb_surface
    font_color = $mb_fg
    check_color = $mb_green_neon
    fail_color = $mb_danger
    capslock_color = $mb_warning
    fail_text = <b>GAME OVER</b> · tente de novo ($ATTEMPTS)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##B0A4BE">INSERT PASSWORD ▸ CONTINUE?</span>
    hide_input = false
    position = 0, 110
    halign = center
    valign = bottom
}

label {
    monitor = DP-1
    text = $LAYOUT
    color = $mb_fg
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = bottom
}

# Monitor secundário: só um aviso discreto
label {
    monitor = HDMI-A-1
    text = P2 // STANDBY
    color = $mb_purple
    font_size = 18
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 0
    halign = center
    valign = center
}
