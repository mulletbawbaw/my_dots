# ── MulletBawbaw // Hyprland ─────────────────────────────────────────
# Carregado por hyprland.conf DEPOIS de UserDecorations/UserAnimations/
# WindowRules, então sobrescreve só o que precisa.
# Rollback: comente a linha "source = .../mulletbawbaw/rice.conf".
# Cores: colors.conf (gerado por ~/my_dots/theme/generate.py)

source = $HOME/.config/hypr/mulletbawbaw/colors.conf

general {
    border_size = 2
    gaps_in = 4
    gaps_out = 8
    # Foco: gradiente roxo neon -> verde zumbi. Sem rotação contínua (custa frames à toa).
    col.active_border = $mb_purple_neon $mb_green_neon 45deg
    col.inactive_border = $mb_border_dim
    col.nogroup_border_active = $mb_warning
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
    dim_inactive = false

    # "Brilho" roxo discreto na janela focada; inativas só com sombra escura
    shadow {
        enabled = true
        range = 14
        render_power = 3
        offset = 0 3
        color = $mb_glow
        color_inactive = $mb_shadow
    }

    # Blur só aparece atrás de superfícies transparentes (kitty, barra, menus).
    # 2 passes x 5 é leve para a RTX 3060; o custo fica na GPU, não no Ryzen.
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        xray = false
        ignore_opacity = true
        noise = 0.02
        contrast = 1.0
        brightness = 0.9
        vibrancy = 0.15
        special = true
        popups = true
    }
}

group {
    col.border_active = $mb_green_neon $mb_purple 45deg
    col.border_inactive = $mb_border_dim
    groupbar {
        font_family = $mb_font
        font_size = 10
        col.active = $mb_purple_neon
        col.inactive = $mb_border
        text_color = $mb_fg
    }
}

# ── Animações: rápidas, com "snap" de arcade ─────────────────────────
# Velocidade em décimos de segundo (1 = 100 ms).
animations {
    enabled = yes
    bezier = mbSnap,  0.16, 1.00, 0.30, 1.00   # desacelera forte: rápido e preciso
    bezier = mbPop,   0.34, 1.30, 0.64, 1.00   # overshoot pequeno (~5%), sem bounce
    bezier = mbExit,  0.55, 0.00, 1.00, 0.45   # acelera ao sair
    bezier = linear,  0, 0, 1, 1

    animation = windowsIn,       1, 1.7, mbPop,  popin 86%
    animation = windowsOut,      1, 1.2, mbExit, popin 92%
    animation = windowsMove,     1, 2.0, mbSnap, slide
    animation = fadeIn,          1, 1.6, mbSnap
    animation = fadeOut,         1, 1.1, mbExit
    animation = fadeSwitch,      1, 2.0, mbSnap
    animation = fadeShadow,      1, 2.0, mbSnap
    animation = fadeDim,         1, 2.0, mbSnap
    animation = border,          1, 2.5, mbSnap
    animation = borderangle,     0
    animation = layersIn,        1, 1.0, mbSnap, popin 94%
    animation = layersOut,       1, 0.8, mbExit, fade
    animation = fadeLayersIn,    1, 1.0, mbSnap
    animation = fadeLayersOut,   1, 0.8, mbExit
    animation = workspaces,      1, 1.9, mbSnap, slidefade 12%
    animation = specialWorkspace,1, 1.8, mbSnap, slidefadevert 20%
}

# ── Regras: janelas de trabalho opacas ───────────────────────────────
# As regras herdadas deixavam terminal a 0.8 e navegador/IDE a 0.9/0.7.
# Opacidade de janela apaga o TEXTO junto; transparência agora é do próprio
# app (kitty background_opacity), que preserva a nitidez.
windowrule = opacity 1.0 override 1.0 override, match:tag browser*
windowrule = opacity 1.0 override 1.0 override, match:tag projects*
windowrule = opacity 1.0 override 1.0 override, match:tag terminal*
windowrule = opacity 1.0 override 1.0 override, match:tag im*
windowrule = opacity 1.0 override 1.0 override, match:tag multimedia*
windowrule = opacity 1.0 override 1.0 override, match:tag viewer*
windowrule = opacity 1.0 override 1.0 override, match:tag file-manager*
# Jogos: sem sombra/blur/borda arredondada (direct scanout precisa disso)
windowrule = no_shadow 1, match:tag games*
windowrule = no_blur 1, match:tag games*
windowrule = rounding 0, match:tag games*

# Superfícies do rice com blur
layerrule = match:namespace waybar, blur on
layerrule = match:namespace waybar, ignore_alpha 0.3
layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-control-center, ignore_alpha 0.3
layerrule = match:namespace swaync-notification-window, blur on
layerrule = match:namespace swaync-notification-window, ignore_alpha 0.3
layerrule = match:namespace logout_dialog, blur on
layerrule = match:namespace rofi, animation popin 94%
layerrule = match:namespace selection, no_anim on

# ── Binds do rice ────────────────────────────────────────────────────
# Limpa duplicatas herdadas antes de redefinir cada tecla uma única vez
unbind = SUPER SHIFT, left
unbind = SUPER SHIFT, right
unbind = SUPER SHIFT, up
unbind = SUPER SHIFT, down
unbind = SUPER, W
unbind = SUPER, A
unbind = SUPER SHIFT, G

bind = SUPER SHIFT, left,  movewindow, mon:left
bind = SUPER SHIFT, right, movewindow, mon:right
bind = SUPER SHIFT, up,    movewindow, mon:up
bind = SUPER SHIFT, down,  movewindow, mon:down
bind = SUPER, W, exec, $HOME/.config/hypr/scripts/WallpaperPicker.sh

# Redimensionar agora é um submap (antes SUPER+SHIFT+setas fazia
# redimensionar E mover de monitor ao mesmo tempo).
bind = SUPER, R, submap, resize
submap = resize
binde = , left,  resizeactive, -40 0
binde = , right, resizeactive, 40 0
binde = , up,    resizeactive, 0 -40
binde = , down,  resizeactive, 0 40
binde = , h,     resizeactive, -40 0
binde = , l,     resizeactive, 40 0
binde = , k,     resizeactive, 0 -40
binde = , j,     resizeactive, 0 40
bind  = , escape, submap, reset
bind  = , Return, submap, reset
bind  = SUPER, R, submap, reset
submap = reset

# Overview de workspaces (Quickshell já instalado; substitui o ags ausente)
bind = SUPER, A, exec, pkill rofi; qs -c overview ipc call overview toggle

# Modo jogo real (efeitos + restauração de estado), ver ~/.local/bin/rice-gaming
bind = SUPER SHIFT, G, exec, $HOME/.local/bin/rice-gaming toggle
