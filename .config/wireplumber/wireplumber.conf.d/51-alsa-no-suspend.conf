# Não suspender as saídas/entradas ALSA quando ficam ociosas.
# O suspend padrão (5s) faz o início dos sons ser cortado e gera estalos
# ao reabrir o dispositivo.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*" }
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
